name: Compilar aplicativo Windows

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Instalar componentes
        run: python -m pip install -r requirements.txt
      - name: Gerar executavel
        run: >
          python -m PyInstaller --noconfirm --clean --onefile --windowed
          --name "Eclipse Downloader" --collect-all yt_dlp
          --collect-all imageio_ffmpeg --collect-all PIL app.py
      - name: Criar pacote e checksum
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path portable
          Copy-Item "dist/Eclipse Downloader.exe" "portable/Eclipse Downloader.exe"
          "Eclipse Downloader portatil. Extraia e abra o arquivo EXE." | Set-Content -Encoding UTF8 "portable/LEIA-ME.txt"
          Compress-Archive -Path portable/* -DestinationPath EclipseDownloader-Portatil-Windows.zip
          (Get-FileHash EclipseDownloader-Portatil-Windows.zip -Algorithm SHA256).Hash.ToLower() + "  EclipseDownloader-Portatil-Windows.zip" | Set-Content -Encoding ascii EclipseDownloader-Portatil-Windows.zip.sha256
      - uses: actions/upload-artifact@v4
        with:
          name: EclipseDownloader-Portatil-Windows
          path: |
            EclipseDownloader-Portatil-Windows.zip
            EclipseDownloader-Portatil-Windows.zip.sha256
      - name: Ler versao
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        id: version
        shell: pwsh
        run: |
          $text = Get-Content app.py -Raw
          $version = [regex]::Match($text, 'APP_VERSION = "([^"]+)"').Groups[1].Value
          "version=$version" >> $env:GITHUB_OUTPUT
      - name: Publicar atualizacao
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $tag = "v${{ steps.version.outputs.version }}"
          gh release view $tag 2>$null
          if ($LASTEXITCODE -eq 0) {
            gh release upload $tag EclipseDownloader-Portatil-Windows.zip EclipseDownloader-Portatil-Windows.zip.sha256 --clobber
          } else {
            gh release create $tag EclipseDownloader-Portatil-Windows.zip EclipseDownloader-Portatil-Windows.zip.sha256 --title "Eclipse Downloader $tag" --notes "Versao portatil para Windows." --latest
          }
